name: Pipeline CI Comercial Chiclayo

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  auditoria-y-pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Obtener codigo fuente
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: 4. Ejecutar auditoria estatica (Flake8)
        run: |
          flake8 src/ scripts/ --max-line-length=100

      - name: 5. Ejecutar pruebas unitarias (Pytest)
        run: |
          pytest

      - name: 6. Ejecutar script de auditoria interna
        run: |
         PYTHONPATH= python scripts/auditoria_sistema.py

      - name: 7. Subir artefacto de auditoria
        uses: actions/upload-artifact@v4
        with:
          name: reporte-auditoria-calidad
          path: reporte_auditoria.txt

      - name: 8. Generar resumen ejecutivo de la ejecucion
        run: |
          echo "## 📊 Resumen de Ejecucion CI/CD" >> $GITHUB_STEP_SUMMARY
          echo "| Etapa | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Flake8 (PEP 8) | ✅ Aprobado |" >> $GITHUB_STEP_SUMMARY
          echo "| Pytest (Pruebas Unitarias) | ✅ Aprobado |" >> $GITHUB_STEP_SUMMARY
          echo "| Script de Auditoria | ✅ Generado |" >> $GITHUB_STEP_SUMMARY
          echo "| Artefacto de Calidad | 📦 Guardado |" >> $GITHUB_STEP_SUMMARY